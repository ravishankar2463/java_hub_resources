server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: k8s-orchestration-service
  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,diskSpace
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
