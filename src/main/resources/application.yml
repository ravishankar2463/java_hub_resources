server:
  port: 8080
spring:
  application:
    name: hikaricp-pool-app
  datasource:
    url: jdbc:h2:mem:pooltest
    driverClassName: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      pool-name: "JavaHubHikariPool"
