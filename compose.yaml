services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: javahub/docker-service:latest
    container_name: javahub-docker-app
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    environment:
      - SPRING_PROFILES_ACTIVE=production
    restart: unless-stopped
